<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bizarro Bible</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-scroll">

        <div id="setup-screen" class="screen-container">
            <h1>Bizarro Bible</h1>

            <div class="logo-placeholder"></div>

            <div class="form-group">
                <label>Select Translation:</label>
                <select id="translation-select">
                    <option value="ESV">ESV</option>
                    <option value="AMP">AMP</option>
                    <option value="ASV">ASV</option>
                    <option value="CPDV">CPDV</option>
                    <option value="ERV">ERV</option>
                    <option value="KJV">KJV</option>
                    <option value="NASB">NASB</option>
                    <option value="WEB">WEB</option>
                </select>
            </div>

            <div class="form-group">
                <label>Select Book:</label>
                <select id="book-select"></select>
            </div>
    <div class="form-group">
        <label>Start flipped: <span id="flip-value">50</span>%</label>
<input type="range" id="flip-slider" min="0" max="100" step="10" value="50">
    </div>
            <button id="generate-btn" class="ctk-btn primary-btn">GENERATE BOARD</button>
            <button id="how-to-play-btn" class="ctk-btn secondary-btn">HOW TO PLAY</button>
        </div>

        <div id="game-screen" class="screen-container" style="display: none;">
            <h2 id="game-title">BIZARRO BIBLE</h2>

            <div id="verse-display"></div>

            <div id="msg-label" class="msg-text"></div>

            <div class="ctrl-frame">
                <button id="new-verses-btn" class="ctk-btn action-btn">New Verses</button>
                <button id="check-btn" class="ctk-btn action-btn">Check</button>
                <button id="back-btn" class="ctk-btn action-btn">Quit</button>
            </div>
        </div>

    </div>
<script src="https://cdn.jsdelivr.net/npm/compromise@v14.20.0/builds/compromise.min.js"></script>
<script src="script.js"></script>
</body>
</html>
